[project]
name = "disp"
version = "1.0.0"
description = "DISP platform: FastAPI backbone + auth subsystem + notes demo module + disp Typer CLI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    # Required for multipart/form-data parsing (plant photo uploads); FastAPI
    # raises at import time on a File()/UploadFile route without it.
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "procrastinate>=2.9",
    "apprise>=1.9",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "python-dateutil>=2.9",
    "structlog>=24.4",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "platformdirs>=4.3",
    "tomli-w>=1.1",
    "slowapi>=0.1.9",
    # M19: core LLM service (src/disp/core/llm/). Imported in exactly one
    # file, src/disp/core/llm/client.py — see L4/§10, enforced by
    # tests/core/test_boundaries.py.
    "anthropic>=0.68",
    # M20: learning module (src/disp/modules/learning/). SQLAlchemy Vector
    # type over the pgvector/pgvector:pg16 extension (learning/models.py §5.1).
    "pgvector>=0.3",
    # M20 §8.1: flat text extraction for uploaded PDF sources (no layout
    # recovery — structure recovery from PDF is explicitly out of scope, §27).
    "pypdf>=6.16.1",
    # M20 §8.1/§8.2: SRT caption parsing (timestamps, drift, malformed cues)
    # for the srt->plain_text structural pass ahead of §8.2's LLM sectioning.
    "srt>=3.5.3",
    # M18 v2: core file service — S3-compatible object storage (Cloudflare R2
    # in production, MinIO in dev/tests). Imported only in
    # src/disp/core/files/backends/s3.py; link presigning is core's own
    # src/disp/core/files/sigv4.py, not botocore (M18-files.md §9.2).
    "aioboto3>=13",
]

[project.optional-dependencies]
# M19: DISP_EMBEDDING_PROVIDER=local (src/disp/core/llm/embeddings.py). Not a
# hard dependency — no network, no key, no per-token cost, but a meaningfully
# worse retrieval quality and a large image, so it stays opt-in.
local-embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[minio,postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil",
    "types-aioboto3[s3]>=15.5.0",
]

[project.scripts]
disp = "disp.cli.main:app"
disp-admin = "disp.core.cli_admin:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning",
]

[tool.coverage.run]
source = ["src/disp"]
branch = true
# SQLAlchemy's async engine bridges to asyncpg via greenlet_spawn; coverage's
# default (non-greenlet-aware) tracer silently drops lines that resume after
# a greenlet switch (i.e. most code after an `await session.execute(...)`),
# understating coverage for anything that touches the database.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/migrations/versions/*.py" = ["E501"]
# The public error-type names (LLMRefused, LLMTruncated, LLMInvalidOutput,
# LLMInputTooLarge, LLMUnavailable, LLMNotConfigured) are fixed by
# docs/milestones/server/M19-llm.md §10's literal public surface and mirrored in
# tests/core/test_boundaries.py's ALLOWED_LLM_NAMES — not renamable to
# satisfy N818's "Error" suffix convention.
"src/disp/core/llm/errors.py" = ["N818"]
# Same reasoning for the translation error types (TranslationNotSupported,
# TranslationUnavailable, TranslationQuotaExceeded, TranslationRejected,
# TranslationNotConfigured, TranslationInputTooLarge,
# TranslationInvalidResponse): fixed by docs/milestones/server/M22-translation.md
# §9's literal public surface and mirrored in tests/core/test_boundaries.py's
# ALLOWED_TRANSLATION_NAMES.
"src/disp/core/translation/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "disp.core.*"
strict = true

[[tool.mypy.overrides]]
# No published type stubs (M20 §8.1: SRT structural parsing in
# learning/service/ingest.py).
module = "srt"
ignore_missing_imports = true
