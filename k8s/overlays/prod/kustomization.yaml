# Entry point — apply this, not k8s/base/ directly:
#   kubectl apply -k k8s/overlays/prod
# The only overlay this project has or plans to have (single-environment
# scope — see roadmap.md's "Locked-in decisions"). It exists so the base/
# vs overlays/ split means something, per the 2026-09-01 discussion: a
# hypothetical second environment gets a sibling overlays/<name>/ directory
# referencing the same ../../base, not a reason to restructure this one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# The ONE place image tags are pinned (roadmap.md T6; never :latest). Bump
# newTag to deploy a new build. It covers api, its migrate initContainer (T5,
# same image) and worker (T7); web (T9) is a different image and gets its own entry.
#
# aba85dd9ef79 is the first build with M18 v2 (S3-only), the learning module and
# core migrations 0001-0005 (verified by inspecting the image, roadmap.md Cluster
# facts). Older tags (713cd73ac93b, 22d471b1e6ff) have no S3 backend and crash.
images:
  - name: registry.mohsen-hassani.com/mohsen_hassani/disp
    newTag: aba85dd9ef79
