# Non-secret settings for BOTH api (T6) and worker (T7): same image, same
# Settings class, so both mount this via envFrom. Credentials live in the
# Secret `api-secrets` (k8s/secrets/, applied by hand — see roadmap.md T4).
#
# Every value must be a string: quote booleans, or `kubectl apply` rejects it.
#
# File storage is Cloudflare R2 (roadmap.md T8). Only the non-sensitive,
# operator-independent settings live here. The bucket, endpoint (it embeds the
# Cloudflare account id; this repo is public) and keys are in the Secret.
# Without them Settings refuses to boot, so an unfilled Secret fails loudly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-configs
  namespace: mohsen-hassani-disp
data:
  DISP_BASE_URL: https://disp.mohsen-hassani.com # no trailing slash (validated)
  DISP_ENV: production
  DISP_COOKIE_SECURE: "true" # must stay true while DISP_ENV=production (validated)
  DISP_RATE_LIMIT_ENABLED: "true"
  # The intended end state; a no-op on builds where s3 is the only backend.
  # (The older images in the registry have no working S3 backend at all, so
  # none of them can run this. See roadmap.md Cluster facts.)
  DISP_FILES_BACKEND: s3
  DISP_FILES_S3_REGION: auto # R2's region name
