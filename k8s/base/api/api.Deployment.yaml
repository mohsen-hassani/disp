# The disp API. Same image as `worker` (T7), different command. The image has
# no tag on purpose: k8s/overlays/prod/kustomization.yaml pins it (`images:`),
# one line for api/worker/web. Never apply base/ directly. See roadmap.md T6.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mohsen-hassani-disp
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: disp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: disp
    spec:
      automountServiceAccountToken: false # never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        # Numeric on purpose: the image's `USER app` is a name, which Kubernetes
        # can't verify as non-root (CreateContainerConfigError). uid/gid match
        # the Dockerfile's useradd.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Database migrations, on every pod start (roadmap.md T5). Idempotent. If it
        # fails the pod never starts and the previous one keeps serving. Assumes
        # replicas: 1 (Alembic takes no lock, so concurrent pods would race).
        - name: migrate
          image: registry.mohsen-hassani.com/mohsen_hassani/disp # same image/tag as api
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/migrate.sh"]
          envFrom:
            - configMapRef:
                name: api-configs
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: migrate-script
              mountPath: /scripts
              readOnly: true
      containers:
        - name: api
          image: registry.mohsen-hassani.com/mohsen_hassani/disp
          imagePullPolicy: IfNotPresent
          # No `command`: the image's CMD runs uvicorn on 0.0.0.0:8000.
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-configs
            - secretRef:
                name: api-secrets
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30 # up to 60s to boot before liveness takes over
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp # scratch space under the read-only root filesystem
      volumes:
        - name: tmp
          emptyDir: {}
        - name: migrate-script
          configMap:
            name: migrate-script # generated from migrate.sh; kustomize adds the hash suffix
