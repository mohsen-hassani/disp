# In-cluster only; T10's Ingress targets this (name `api`, port 8000).
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mohsen-hassani-disp
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: disp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
