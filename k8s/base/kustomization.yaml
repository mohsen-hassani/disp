# Base aggregator — references one entry per component directory here in
# k8s/base/. Not applied directly; k8s/overlays/prod/ references this and is
# the actual `kubectl apply -k` entry point. Extended as each roadmap.md task
# lands; see roadmap.md for the full plan and task order. Migrations are not a
# separate resource: they run as an initContainer of `api` (T5).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace
  - postgres
  - api
  - worker
  - web
  - ingress
