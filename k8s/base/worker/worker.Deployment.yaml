# The Procrastinate worker: periodic jobs (file sweeper, purges, plant checks, learning
# nudges) and background work deferred by api. Same image as `api` (T6), different
# command. No Service (nothing calls it) and no probes, matching docker-compose.yml:
# Procrastinate exposes no HTTP endpoint. See roadmap.md T7 for why, including a WARNING
# about the file sweeper and the R2 bucket. The image has no tag on purpose; the prod
# overlay's `images:` pins it, same as api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: mohsen-hassani-disp
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: disp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: disp
    spec:
      automountServiceAccountToken: false # never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        # Numeric on purpose: the image's `USER app` is a name, which Kubernetes
        # can't verify as non-root. uid/gid match the Dockerfile's useradd.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.mohsen-hassani.com/mohsen_hassani/disp
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "disp.worker"]
          envFrom:
            - configMapRef:
                name: api-configs
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp # scratch space under the read-only root filesystem
      volumes:
        - name: tmp
          emptyDir: {}
