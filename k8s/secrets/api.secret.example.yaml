# Template — committed. The real file is k8s/secrets/api.secret.yaml (gitignored,
# never commit it). Copy this to that name, fill in the values, then:
#   kubectl apply -f k8s/secrets/api.secret.yaml
# Applied by hand, not through `kubectl apply -k`; see roadmap.md T4.
#
# Consumed via envFrom by both api (T6) and worker (T7).
# The four DISP_FILES_S3_* values below are Cloudflare R2 (roadmap.md T8): create the
# bucket and an Object Read & Write API token scoped to it in the Cloudflare
# dashboard. Settings refuses to boot while any of them is empty.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: mohsen-hassani-disp
type: Opaque
stringData:
  # user/password/dbname come from the Secret CNPG generated for the T3 cluster
  # (`postgres-app`); host is the primary's Service, `postgres-rw`. The scheme must be
  # `postgresql+asyncpg://` (validated), which is why CNPG's own `uri` key is not
  # usable as-is. The password is CNPG-generated, so it is not hand-chosen. Read it with:
  #   kubectl get secret postgres-app -o jsonpath='{.data.password}' | base64 -d
  DISP_DATABASE_URL: postgresql+asyncpg://disp_user:<password>@postgres-rw:5432/disp_db
  # python -c "import secrets; print(secrets.token_urlsafe(48))"   (>= 32 chars, validated)
  DISP_JWT_SECRET: <generated>
  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  DISP_SETTINGS_KEY: <generated>

  # --- Cloudflare R2 (T8) ---
  # Bucket name. NEVER share one bucket between environments: the sweeper deletes
  # every object that has no row in *its own* database.
  DISP_FILES_S3_BUCKET: <bucket-name>
  # Required for R2. If left empty the client targets AWS S3 and fails on first upload.
  # (The validator checks the bucket and keys, not this.) Account id: Cloudflare
  # dashboard -> R2 -> Overview. Kept here, not in the ConfigMap, so it stays out of git.
  DISP_FILES_S3_ENDPOINT_URL: https://<account-id>.r2.cloudflarestorage.com
  # From the R2 API token: "Access Key ID" and "Secret Access Key".
  DISP_FILES_S3_ACCESS_KEY_ID: <r2-access-key-id>
  DISP_FILES_S3_SECRET_ACCESS_KEY: <r2-secret-access-key>
