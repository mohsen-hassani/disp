services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: disp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: disp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      # Plant photos live on a volume, not in Postgres, so `pg_dump` stays
      # small and text-only. Back this volume up alongside the database —
      # see docs/operations.md.
      DISP_PLANTS_MEDIA_ROOT: /data/media/plants
    volumes:
      - media:/data/media
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.disp.rule=Host(`${PUBLIC_HOST}`)
      - traefik.http.routers.disp.tls.certresolver=le
      - traefik.http.services.disp.loadbalancer.server.port=8000

  worker:
    build: .
    command: ["python", "-m", "disp.worker"]
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: postgres://disp:${POSTGRES_PASSWORD:?required}@postgres:5432/disp?sslmode=disable
    # Bound to localhost only, no Traefik labels — pgweb has no built-in
    # multi-user auth, so it must never get a public route. Reach it in
    # production via `ssh -L 8081:localhost:8081 <host>`.
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  traefik:
    image: traefik:v3.2
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

volumes:
  pgdata:
  letsencrypt:
  media:
