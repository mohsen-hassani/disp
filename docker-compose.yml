services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: disp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: disp_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      # Plant photos live on a volume, not in Postgres, so `pg_dump` stays
      # small and text-only. Back this volume up alongside the database —
      # see docs/operations.md.
      DISP_PLANTS_MEDIA_ROOT: /data/media/plants
    volumes:
      - media:/data/media
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - default
      - edge
    labels:
      - traefik.enable=true
      # M12 §24.4: amended from a bare Host() rule to win only API paths,
      # now that `web` (below) also wants this same Host() for everything
      # else — priority=10 beats web's priority=1 when both match.
      - traefik.http.routers.disp.rule=Host(`${PUBLIC_HOST}`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/openapi.json`))
      - traefik.http.routers.disp.priority=10
      - traefik.http.routers.disp.tls.certresolver=le
      - traefik.http.services.disp.loadbalancer.server.port=8000
      - traefik.docker.network=edge

  web:
    build: ./clients/web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      # No `default` — web never talks to postgres/api directly, only via
      # the browser's own /api requests, which Traefik routes separately.
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.disp-web.rule=Host(`${PUBLIC_HOST}`)
      - traefik.http.routers.disp-web.priority=1
      - traefik.http.routers.disp-web.tls.certresolver=le
      # Non-root nginx can't bind :80 (see clients/web/Dockerfile) — 8080 is
      # the container's internal port only, invisible externally.
      - traefik.http.services.disp-web.loadbalancer.server.port=8080
      - traefik.docker.network=edge

  worker:
    build: .
    command: ["python", "-m", "disp.worker"]
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: postgres://disp:${POSTGRES_PASSWORD:?required}@postgres:5432/disp?sslmode=disable
    # Bound to localhost only, no Traefik labels — pgweb has no built-in
    # multi-user auth, so it must never get a public route. Reach it in
    # production via `ssh -L 8081:localhost:8081 <host>`.
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  media:

# `edge` is the shared Traefik network, created by the standalone infra
# project (../infra/docker-compose.yml — see that project's README for the
# full recipe) — not this repo. Traefik itself, its TLS/ACME config, and its
# dynamic-routing file all live there now too; this repo only joins the
# network and carries the routing labels on `api` above.
networks:
  edge:
    external: true
