<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · DISP</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #ffffff;
        color: #16181d;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #131519;
          color: #e8e9ec;
        }
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <!--
      WEB-SPEC §18: the app is read-only offline via cached API responses and
      the precached SPA shell (index.html). This page is the last-resort
      fallback for the rare case where even the precached shell isn't
      available yet (e.g. the very first visit happened offline) — it has no
      script dependency of its own so it can render without the app bundle.
    -->
    <main>
      <h1>You're offline</h1>
      <p>DISP couldn't load because this device has no connection and nothing is cached yet.</p>
    </main>
  </body>
</html>
