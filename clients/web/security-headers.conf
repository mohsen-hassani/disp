# Included explicitly inside every location that also sets its own
# add_header (for Cache-Control) — nginx's add_header inheritance is
# all-or-nothing per block: a location with any add_header of its own
# inherits NONE from its parent, silently dropping these otherwise. See
# nginx.conf's header comment on the regex no-cache location for how this
# was actually caught (curl against a running container, not just a
# clean build).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# img-src/media-src allow the Cloudflare R2 bucket host: file links are
# presigned URLs pointing straight at the bucket, never same-origin
# (docs/milestones/server/M18-files.md §12). Moving to a provider other than
# R2 means editing this line.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.r2.cloudflarestorage.com; media-src 'self' https://*.r2.cloudflarestorage.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
