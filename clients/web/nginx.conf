# M12 §24.3. Full replacement of the stock nginx.conf (not a conf.d
# fragment) so every cache/security/routing rule lives in one reviewable
# file matching this milestone's named deliverable.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Writable paths for the non-root `nginx` user (uid 101, set by the
    # Dockerfile) — the stock image's default paths under /var/cache/nginx
    # are chown'd there already; these three are additional temp dirs the
    # stock main config leaves at their compiled-in defaults, which aren't
    # writable by a non-root user unless redirected.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # style-src 'unsafe-inline' (in the include below) is required by
        # Radix's inline positioning styles (scoped to styles only). No
        # script-src 'unsafe-inline' — theme-bootstrap.js (M01) is already
        # an external file, confirmed at index.html, specifically so this
        # CSP doesn't need one.
        include security-headers.conf;

        # In production Traefik never routes /api here (the api router's
        # priority=10 PathPrefix rule wins) — this exists so the container is
        # still correct standalone, e.g. a direct smoke-test curl, rather
        # than silently serving index.html for an /api path.
        location /api/ {
            return 404;
        }

        # Hashed, content-addressed — safe to cache forever.
        location /assets/ {
            include security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            include security-headers.conf;
            add_header Cache-Control "no-cache" always;
            default_type application/manifest+json;
        }

        # Everything else unhashed at the dist root — a cached copy of any
        # of these is exactly how a PWA gets stuck on a stale version (M09's
        # update flow depends on this not happening), so all of them get the
        # same treatment as index.html, not just the milestone's literally
        # named index.html/sw.js/manifest.webmanifest. theme-bootstrap.js in
        # particular is unhashed despite living outside /assets/ (confirmed:
        # public/theme-bootstrap.js is copied to dist/ verbatim, not through
        # Vite's asset pipeline) — treating it as immutable would be the
        # exact FOUC-on-stale-theme bug M01 was written to avoid.
        # workbox-*.js is genuinely content-hashed and could technically be
        # cached immutably, but it's grouped here too rather than reasoning
        # precisely about workbox's own hashing guarantees.
        location ~ ^/(index\.html|sw\.js|workbox-.*\.js|theme-bootstrap\.js|offline\.html|favicon\.svg|icons/.*)$ {
            include security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
