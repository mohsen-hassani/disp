[alembic]
script_location = src/disp/core/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[core]
script_location = src/disp/core/migrations
version_locations = src/disp/core/migrations/versions
version_table = alembic_version_core
version_table_schema = core

[notes]
script_location = src/disp/modules/notes/migrations
version_locations = src/disp/modules/notes/migrations/versions
version_table = alembic_version_notes
version_table_schema = notes

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
