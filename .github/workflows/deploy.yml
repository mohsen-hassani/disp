name: Build and Deploy

on:
  push:
    branches: [prod]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/disp
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/disp-web

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./clients/web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_WEB }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger webhook deploy
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          PAYLOAD=$(printf '{"image_tag":"%s"}' "$IMAGE_TAG")
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature-256: $SIG" \
            -d "$PAYLOAD"
