  const [menuOpen,setMenuOpen]=React.useState(false);
  return (<div style={{display:"flex",gap:24,alignItems:"flex-start"}}>
    <div style={{position:"relative",height:220,width:280,border:"1px solid var(--color-border)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",gap:16}}>

      </Dialog>

}
