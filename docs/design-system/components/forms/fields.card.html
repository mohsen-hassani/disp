<style>body{margin:0;padding:20px;background:var(--color-surface);font-family:var(--font-sans);display:flex;flex-direction:column;gap:16px;max-width:420px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<div id="root"></div>
<script type="text/babel">
const { TextField, SelectField, Switch, SecretField } = window.DISPDesignSystem_bf3b97;
function Demo(){
  const [name,setName]=React.useState("Household dashboard");
  const [theme,setTheme]=React.useState("system");
  const [on,setOn]=React.useState(true);
  return (<div style={{display:"flex",flexDirection:"column",gap:16}}>
    <TextField label="Display name" value={name} onChange={setName} helpText="Shown in the top bar"/>
    <TextField label="Port" value="8443" type="number" error="Must be between 1 and 65535"/>
    <SelectField label="Theme" value={theme} onChange={setTheme} options={[{label:"System",value:"system"},{label:"Light",value:"light"},{label:"Dark",value:"dark"}]}/>
    <Switch checked={on} onChange={setOn} label="Enable weekly digest"/>
    <SecretField label="Webhook signing key" maskedValue="••••••••••••9f2a" helpText="Used to verify inbound webhooks" onReplace={()=>{}}/>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
