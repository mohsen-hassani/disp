<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-raised);font-family:var(--font-sans);display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:center;gap:10px;font-size:14px}.chip{width:60px;font-size:11px;color:var(--color-text-muted)}.b{width:60px;height:20px;border-radius:6px}</style>
<div class="r"><span class="chip">text</span><span style="color:var(--color-text)">The quick brown fox</span></div>
<div class="r"><span class="chip">text-muted</span><span style="color:var(--color-text-muted)">The quick brown fox</span></div>
<div class="r"><span class="chip">border</span><div class="b" style="border:2px solid var(--color-border)"></div></div>
<div class="r"><span class="chip">border-strong</span><div class="b" style="border:2px solid var(--color-border-strong)"></div></div>
