<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation: borders vs the one shadow" subtitle="Cards use border+surface-step; only overlays get --shadow-overlay" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-text);display:flex;gap:20px;align-items:center}.card{width:150px;height:100px;border-radius:10px;background:var(--color-surface-raised);border:1px solid var(--color-border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--color-text-muted)}.overlay{width:150px;height:100px;border-radius:10px;background:var(--color-surface-raised);box-shadow:var(--shadow-overlay);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--color-text-muted);padding-left:10px;padding-right:10px}</style>
<div class="card">card (border only)</div>
<div class="overlay">dialog/dropdown/toast (shadow-overlay)</div>
