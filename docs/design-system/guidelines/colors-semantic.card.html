<!-- @dsCard group="Colors" viewport="700x120" name="Semantic status" subtitle="Success / warning / danger — used sparingly, never decoratively" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface);font-family:var(--font-sans);display:flex;gap:12px}.sw{flex:1;height:80px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}</style>
<div class="sw" style="background:color-mix(in oklch,var(--color-success) 16%,var(--color-surface-raised));color:var(--color-success)">success</div>
<div class="sw" style="background:color-mix(in oklch,var(--color-warning) 16%,var(--color-surface-raised));color:var(--color-warning)">warning</div>
<div class="sw" style="background:color-mix(in oklch,var(--color-danger) 16%,var(--color-surface-raised));color:var(--color-danger)">danger</div>
