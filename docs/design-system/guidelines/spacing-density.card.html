<!-- @dsCard group="Spacing" viewport="700x150" name="Density: mobile vs desktop" subtitle="44px+ touch targets on mobile; tighter rows on desktop" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);display:flex;gap:24px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font-size:11px;color:var(--color-text-muted)}.mob{height:44px;min-width:160px;border:1px solid var(--color-border);border-radius:10px;display:flex;align-items:center;padding:0 12px;font-size:14px}.desk{height:32px;min-width:160px;border:1px solid var(--color-border);border-radius:6px;display:flex;align-items:center;padding:0 10px;font-size:13px}</style>
<div class="col"><span class="lbl">mobile — 44px row</span><div class="mob">Tap target</div></div>
<div class="col"><span class="lbl">desktop — 32px row</span><div class="desk">Dense row</div></div>
